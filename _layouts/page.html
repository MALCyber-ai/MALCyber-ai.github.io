---
layout: default
---

<div class="container page-wrap{% if page.narrow %} page-narrow{% endif %}">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.lede %}
    <p class="lede">{{ page.lede }}</p>
    {% endif %}
  </header>

  <div class="entry">
    {{ content }}
  </div>
</div>
