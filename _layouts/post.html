---
layout: default
---

<article class="container page-wrap page-narrow post">
  <header class="page-header">
    <p class="kicker">Blog</p>
    <h1>{{ page.title }}</h1>
    <p class="post-date">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>

  <div class="entry">
    {{ content }}
  </div>

  <p class="post-footer">
    <a href="{{ '/blog/' | relative_url }}">All posts</a>
  </p>

  {% include disqus.html %}
</article>
