#
# Site identity. These values show up in the header, the page title, and social previews.
#

name: Mark Anthony
description: Cybersecurity and IT student documenting hands-on labs, Linux setup, and practical security skills.

#
# Homepage hero. Edit these to change the landing-page copy.
#

headline: Cybersecurity & IT
intro: Practical labs and plain-language write-ups a hiring manager can review.

#
# Links. youtube_url is the only place the channel address lives.
# Leave it blank until a channel exists — the YouTube button then opens the videos page.
# Paste a full channel URL later and the same button will point there.
#

github_url: https://github.com/MALCyber-ai
youtube_url: ""

#
# Optional. Leave blank to keep them off.
#

email:
disqus:
google_analytics:

# Used for the sitemap and the RSS feed. Set this to the live site URL when you have one.
url:
baseurl: ""

permalink: /:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
